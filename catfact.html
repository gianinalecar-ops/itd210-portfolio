<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://kit.fontawesome.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https:;
    media-src 'self';
    connect-src 'self';
  ">
  <title>Cat Facts</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #2d7980;
    }

    h1 {
        color: #ffffff;
    }

    #fact-box {
      margin: 20px auto;
      padding: 20px;
      width: 60%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 18px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #00433b;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>

<body>
  <h1>Random Cat Facts</h1>
  <div id="fact-box">Loading a cat fact...</div>
  <button id="new-fact-btn">Get New Fact</button>

  <script>
    // Select elements from DOM
    var factBox = document.getElementById("fact-box");
    var btn = document.getElementById("new-fact-btn");

    // Create function to fetch fact
    async function getFact() {
        try {
            factBox.textContent = "Loading...";

            const response = await fetch("https://catfact.ninja/fact");

        if (!response.ok) {
            throw new Error("Network response was not ok");
        }

        // Convert response to JSON
        const data = await response.json();

        // Displays the fact
        factBox.textContent = data.fact;

    } catch (error) {
        factBox.textContent = "Could not load fact. Try again!";
        console.error(error);
    }
}

    // Run on page load
    getFact();

    // Run when button clicked
    btn.addEventListener("click", getFact);
  </script>

</body>
</html>
