<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Cycles International</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js"></script>
    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }

    h2 {
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      margin-right: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #ffcb05;
      color: #3b4cca;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #f5b700;
    }

    input {
      padding: 10px;
      margin-right: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    #dataContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    #dataContainer div {
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      width: 150px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #dataContainer img {
      width: 96px;
      height: 96px;
      margin-bottom: 10px;
    }

    #loadingMessage {
      font-weight: bold;
      color: #3b4cca;
    }

    #errorMessage {
      color: red;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
     <!-- Header Section -->
     <header class="site-header">
      <div class="logo"><i class="fa-solid fa-globe stat-icon"></i>
         <span> Breaking Cycles International</span>
      </div>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="programs.html">Programs</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
     </nav>

     <!-- Mobile Nav Button -->
     <button class="menu-toggle" id="mobileToggle" aria-label="Open Menu">
      <i class="fa-solid fa-bars stat-icon"></i>
     </button>
     </header>

     <!-- Mobile Navigation -->
   <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
      <button class="close-menu" id="closeMenu" aria-label="Close menu">
         <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="programs.html">Programs</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
     </nav>
</body>
    <main>
    <!-- Controls -->
    <section>
      <h2>Pokémon Fetcher</h2>
      <button id="loadBtn">Load Pokémon</button>
      <input type="text" id="searchInput" placeholder="Search Pokémon by name">
      <button id="searchBtn">Search</button>
    </section>

    <!-- Status -->
    <section>
      <p id="loadingMessage" style="display: none;">Loading...</p>
      <p id="errorMessage"></p>
    </section>

    <!-- Results -->
    <section>
      <div id="dataContainer">
        <!-- Pokémon cards will appear here -->
      </div>
    </section>
  </main>
</html>
